<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
    <title>CAS Door Calendar · Room Assignment</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="icon" href="https://wxyzofficial.sirv.com/USC-Election/cas.png" type="image/png" />
    <style>
        /* ----- RESET & VARIABLES ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --primary-blue: #0a3d6b;
            --primary-yellow: #f5b81b;
            --white: #ffffff;
            --light-bg: #f2f7ff;
            --card-bg: #ffffff;
            --shadow-soft: 0 8px 24px rgba(0, 20, 40, 0.06);
            --radius-card: 20px;
            --radius-btn: 40px;
            --transition: 0.2s ease;
            --text-dark: #1a2634;
            --text-muted: #4a5a6e;
            --border-light: #e9edf4;
        }

        html,
        body {
            height: 100%;
            background: var(--light-bg);
            color: var(--text-dark);
            scroll-behavior: smooth;
        }

        #app-wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            flex: 1 0 auto;
            padding: 1.5rem 1.8rem 2rem;
            max-width: 1440px;
            margin: 0 auto;
            width: 100%;
        }

        /* ----- BUTTONS & BADGES ----- */
        .btn-primary {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 0.6rem 1.6rem;
            border-radius: var(--radius-btn);
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 4px 12px rgba(10, 61, 107, 0.15);
            transition: var(--transition);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-primary:hover {
            background: #0a2f52;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(10, 61, 107, 0.25);
        }
        .btn-ghost {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.4rem 1rem;
            border-radius: var(--radius-btn);
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-ghost:hover {
            background: rgba(10, 61, 107, 0.06);
            color: var(--primary-blue);
        }

        .badge-status {
            padding: 0.2rem 0.9rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            display: inline-block;
            background: #eef2f6;
            color: #2c3e50;
        }
        .badge-available {
            background: #d4edda;
            color: #0b5e2e;
        }
        .badge-occupied {
            background: #f8d7da;
            color: #a11f2f;
        }

        /* ----- HEADER ----- */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            padding: 0.6rem 2rem;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.6);
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .logo-area img {
            height: 40px;
            width: auto;
        }
        .logo-area h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--primary-blue);
            letter-spacing: -0.3px;
        }
        .logo-area span {
            font-weight: 300;
            color: #2c3e50;
        }
        .admin-badge {
            background: var(--primary-yellow);
            color: #0a2f52;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        /* ----- FOOTER ----- */
        .app-footer {
            flex-shrink: 0;
            background: white;
            border-top: 1px solid var(--border-light);
            padding: 1rem 2rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .app-footer strong {
            color: var(--primary-blue);
            font-weight: 600;
        }

        /* ----- MODAL ----- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: 0.2s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-box {
            background: white;
            max-width: 560px;
            width: 94%;
            border-radius: 32px;
            padding: 2rem 2rem 2.2rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
            transform: scale(0.96) translateY(20px);
            transition: 0.25s ease;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-overlay.active .modal-box {
            transform: scale(1) translateY(0);
        }
        .modal-box h2 {
            margin-bottom: 0.3rem;
            color: var(--primary-blue);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .modal-box .modal-subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
        }
        .modal-box .modal-room-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.7rem 1rem;
            border-bottom: 1px solid var(--border-light);
        }
        .modal-box .modal-room-item:last-child {
            border-bottom: none;
        }
        .modal-box .modal-room-item .room-info {
            font-weight: 500;
        }
        .modal-box .modal-room-item .room-time {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .modal-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 1rem;
        }
        .modal-close-btn {
            background: transparent;
            border: none;
            font-size: 1.8rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.2s;
            padding: 0 0.3rem;
        }
        .modal-close-btn:hover {
            color: var(--text-dark);
        }

        /* ----- LOADER & TOAST ----- */
        .loader-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: 0.2s;
        }
        .loader-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .spinner {
            border: 6px solid #e9edf2;
            border-top: 6px solid var(--primary-blue);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            max-width: 360px;
        }
        .toast-item {
            background: #1e2a36;
            color: white;
            padding: 0.7rem 1.6rem;
            border-radius: 40px;
            font-weight: 500;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15);
            animation: slideUp 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 0.9rem;
        }
        .toast-item.success {
            background: #0b5e2e;
        }
        .toast-item.error {
            background: #a11f2f;
        }
        .toast-item.info {
            background: var(--primary-blue);
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ----- DAY TABS ----- */
        .day-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin: 1.2rem 0 1.5rem;
            padding-bottom: 0.4rem;
            border-bottom: 2px solid rgba(10, 61, 107, 0.06);
        }
        .day-tab {
            background: transparent;
            border: none;
            padding: 0.5rem 1.4rem;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .day-tab.active {
            background: var(--primary-blue);
            color: white;
            box-shadow: 0 4px 12px rgba(10, 61, 107, 0.15);
        }
        .day-tab:hover:not(.active) {
            background: rgba(10, 61, 107, 0.05);
        }

        /* ----- SEARCH FILTERS ----- */
        .search-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem 1rem;
            align-items: center;
            background: white;
            padding: 0.8rem 1.5rem;
            border-radius: 60px;
            box-shadow: var(--shadow-soft);
            margin-bottom: 1.5rem;
            border: 1px solid rgba(0, 0, 0, 0.02);
        }
        .search-filters input,
        .search-filters select {
            border: 1px solid var(--border-light);
            border-radius: 40px;
            padding: 0.5rem 1.2rem;
            background: white;
            font-size: 0.9rem;
            min-width: 120px;
            transition: 0.2s;
            color: var(--text-dark);
        }
        .search-filters input:focus,
        .search-filters select:focus {
            outline: 2px solid var(--primary-blue);
            border-color: transparent;
        }
        .filter-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-right: 0.2rem;
        }

        /* ----- TWO-COLUMN LAYOUT (Faculty List + Room Grid) ----- */
        .two-col {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 1.8rem;
            margin-top: 1rem;
        }
        @media (max-width: 820px) {
            .two-col {
                grid-template-columns: 1fr;
            }
        }

        /* ----- FACULTY LIST (left panel) ----- */
        .faculty-panel {
            background: white;
            border-radius: var(--radius-card);
            padding: 1.2rem 1.2rem 1.5rem;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border-light);
            max-height: 600px;
            overflow-y: auto;
        }
        .faculty-panel .panel-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--primary-blue);
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 2px solid var(--border-light);
            padding-bottom: 0.6rem;
        }
        .faculty-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 0.8rem;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid transparent;
            margin-bottom: 0.25rem;
        }
        .faculty-item:hover {
            background: rgba(10, 61, 107, 0.05);
            border-color: var(--border-light);
        }
        .faculty-item .faculty-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary-blue);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        .faculty-item .faculty-name {
            font-weight: 500;
            font-size: 0.9rem;
            flex: 1;
        }
        .faculty-item .faculty-count {
            font-size: 0.7rem;
            background: var(--light-bg);
            padding: 0.1rem 0.6rem;
            border-radius: 40px;
            color: var(--text-muted);
        }
        .faculty-item .faculty-arrow {
            color: var(--text-muted);
            font-size: 0.8rem;
            opacity: 0.5;
        }
        .faculty-item:hover .faculty-arrow {
            opacity: 1;
        }

        /* ----- ROOM GRID (right panel) ----- */
        .room-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
        }
        .room-card {
            background: var(--card-bg);
            border-radius: var(--radius-card);
            padding: 1rem 1.2rem 1.2rem;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border-light);
            transition: 0.2s;
        }
        .room-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 20, 40, 0.08);
        }
        .room-card .room-name {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--primary-blue);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .room-card .room-name i {
            color: var(--primary-yellow);
            font-size: 0.9rem;
        }
        .room-card .meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 0.1rem 0 0.3rem;
        }
        .room-card .assignment-entry {
            border-top: 1px solid var(--border-light);
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            font-size: 0.85rem;
        }
        .room-card .assignment-entry strong {
            color: var(--primary-blue);
        }
        .room-card .assignment-entry .time-slot {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.8rem;
        }

        /* ----- AVAILABLE FINDER ----- */
        .finder-box {
            background: white;
            border-radius: 40px;
            padding: 1rem 2rem;
            margin: 1.5rem 0;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border-light);
        }
        .finder-box .finder-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem 1.2rem;
            align-items: center;
        }
        .finder-box .finder-row .label {
            font-weight: 600;
            color: var(--text-dark);
        }
        .finder-box select,
        .finder-box input {
            border-radius: 40px;
            padding: 0.4rem 1.2rem;
            border: 1px solid var(--border-light);
            background: white;
            font-size: 0.9rem;
        }
        #finderResults {
            margin-top: 0.8rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .finder-result-chip {
            background: #d4edda;
            padding: 0.2rem 1.2rem;
            border-radius: 40px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.85rem;
        }
        .finder-result-chip i {
            color: #0b5e2e;
        }

        /* ----- BUILDING ACCORDION ----- */
        .building-block {
            margin-top: 2rem;
        }
        .building-header {
            background: white;
            padding: 0.7rem 1.8rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: var(--shadow-soft);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
            margin-bottom: 0.4rem;
            border: 1px solid var(--border-light);
        }
        .building-header:hover {
            background: var(--primary-blue);
            color: white;
        }
        .floor-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 0.5rem;
            margin: 0.5rem 0 1.2rem;
        }
        .floor-card {
            background: white;
            padding: 0.4rem 0.8rem;
            border-radius: 40px;
            font-weight: 500;
            border: 1px solid var(--border-light);
            text-align: center;
            font-size: 0.85rem;
        }
        .floor-card i {
            margin-right: 0.3rem;
            color: var(--primary-blue);
        }

        /* ----- EMPTY STATE ----- */
        #emptyState {
            text-align: center;
            padding: 2.5rem 0;
            color: var(--text-muted);
        }
        #emptyState i {
            font-size: 2.5rem;
            color: #c0d0e0;
            margin-bottom: 0.6rem;
        }

        /* ----- CLOCK ----- */
        #live-clock {
            background: white;
            padding: 0.2rem 1.4rem;
            border-radius: 40px;
            font-weight: 600;
            box-shadow: var(--shadow-soft);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            border: 1px solid var(--border-light);
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 640px) {
            .app-header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
                padding: 0.8rem 1rem;
            }
            .search-filters {
                border-radius: 28px;
                padding: 1rem;
                flex-direction: column;
                align-items: stretch;
            }
            .search-filters input,
            .search-filters select {
                width: 100%;
            }
            .day-tabs {
                justify-content: center;
            }
            .room-grid {
                grid-template-columns: 1fr;
            }
            .finder-box {
                padding: 1rem;
            }
            .finder-box .finder-row {
                flex-direction: column;
                align-items: stretch;
            }
            main {
                padding: 1rem;
            }
            .faculty-panel {
                max-height: 300px;
            }
        }
    </style>
</head>
<body>
    <div id="app-wrapper">
        <!-- HEADER -->
        <header class="app-header">
            <div class="logo-area">
                <img src="https://wxyzofficial.sirv.com/USC-Election/cas.png" alt="CAS Logo" />
                <h1>CAS <span>Door Calendar</span></h1>
            </div>
            <div style="display:flex;gap:0.6rem;align-items:center;flex-wrap:wrap;">
                <a href="admin.html" class="admin-badge"><i class="fas fa-user-cog"></i> Admin</a>
                <a href="login.html" class="btn-primary" style="padding:0.3rem 1.2rem;font-size:0.8rem;">
                    <i class="fas fa-sign-in-alt"></i> Login
                </a>
            </div>
        </header>

        <!-- MAIN -->
        <main>
            <!-- Title + Clock -->
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.8rem;margin-bottom:0.2rem;">
                <h2 style="color:var(--primary-blue);font-size:1.5rem;display:flex;align-items:center;gap:0.6rem;">
                    <i class="fas fa-door-open" style="color:var(--primary-yellow);"></i> Live Schedule
                </h2>
                <span id="live-clock">
                    <i class="far fa-clock"></i> <span id="clock-display">--:--</span>
                </span>
            </div>
            <p style="color:var(--text-muted);margin-bottom:0.3rem;font-size:0.9rem;">
                <i class="fas fa-info-circle"></i> Select a day. Click a faculty name to see their assigned rooms.
            </p>

            <!-- DAY TABS -->
            <div class="day-tabs" id="dayTabsContainer"></div>

            <!-- SEARCH & FILTERS -->
            <div class="search-filters" id="filterBar">
                <span class="filter-label"><i class="fas fa-search"></i> Search</span>
                <input type="text" id="searchInput" placeholder="Room, faculty, subject..." />
                <span class="filter-label"><i class="fas fa-building"></i> Building</span>
                <select id="filterBuilding">
                    <option value="">All</option>
                    <option>NEW CAS BUILDING</option>
                    <option>ACAD BUILDING</option>
                </select>
                <span class="filter-label"><i class="fas fa-circle"></i> Status</span>
                <select id="filterStatus">
                    <option value="">All</option>
                    <option>available</option>
                    <option>occupied</option>
                </select>
                <button class="btn-ghost" id="clearFiltersBtn"><i class="fas fa-undo-alt"></i> Reset</button>
            </div>

            <!-- AVAILABLE FINDER -->
            <div class="finder-box">
                <div class="finder-row">
                    <i class="fas fa-lightbulb" style="color:var(--primary-yellow);font-size:1.2rem;"></i>
                    <span class="label">Available rooms</span>
                    <select id="finderDay">
                        <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
                        <option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
                    </select>
                    <input type="time" id="finderTime" value="14:00" />
                    <button class="btn-primary" id="finderBtn" style="padding:0.3rem 1.2rem;font-size:0.85rem;"><i class="fas fa-search"></i> Check</button>
                    <button class="btn-ghost" id="useCurrentTimeBtn" style="font-size:0.8rem;"><i class="fas fa-clock"></i> Use Current Time</button>
                </div>
                <div id="finderResults"></div>
            </div>

            <!-- TWO COLUMN: Faculty List + Room Cards -->
            <div class="two-col">
                <!-- LEFT: Faculty List -->
                <div class="faculty-panel" id="facultyPanel">
                    <div class="panel-title"><i class="fas fa-user-tie"></i> Faculty</div>
                    <div id="facultyListContainer"></div>
                </div>

                <!-- RIGHT: Room Cards -->
                <div>
                    <div id="roomCardsContainer" class="room-grid"></div>
                    <div id="emptyState" style="display:none;">
                        <i class="fas fa-calendar-times"></i>
                        <p>No assignments for this day.</p>
                    </div>
                </div>
            </div>

            <!-- BUILDING VIEW (accordion) -->
            <!-- <div class="building-block" id="buildingView">
                <div class="building-header" data-building="NEW CAS BUILDING">
                    <span><i class="fas fa-building"></i> NEW CAS BUILDING</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="floor-list" id="floorsNewCas"></div>

                <div class="building-header" data-building="ACAD BUILDING" style="margin-top:1.2rem;">
                    <span><i class="fas fa-building"></i> ACAD BUILDING</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="floor-list" id="floorsAcad"></div>
            </div> -->
        </main>

        <footer class="app-footer">
            Designed and Developed by: <strong>Steven Macapañas</strong>
        </footer>
    </div>

    <!-- TOAST, LOADER, MODAL -->
    <div class="toast-container" id="toastContainer"></div>
    <div class="loader-overlay" id="loaderOverlay">
        <div class="spinner"></div>
    </div>

    <!-- FACULTY MODAL -->
    <div class="modal-overlay" id="facultyModal">
        <div class="modal-box">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;">
                <div>
                    <h2 id="facultyModalName"><i class="fas fa-user-tie"></i> Faculty Name</h2>
                    <div class="modal-subtitle" id="facultyModalDay">Assignments for Monday</div>
                </div>
                <button class="modal-close-btn" id="facultyModalClose">&times;</button>
            </div>
            <div id="facultyModalRooms"></div>
            <div class="modal-actions">
                <button class="btn-primary" id="facultyModalConfirm">Close</button>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js"
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from 'firebase/app';
        import { getFirestore, collection, query, onSnapshot, orderBy } from 'firebase/firestore';
        import { getAuth, onAuthStateChanged } from 'firebase/auth';

        const firebaseConfig = {
            apiKey: "AIzaSyBPpmLPiRmLq0bXvHpcEFh6uvnF7RFqZnQ",
            authDomain: "a7kp9xq2.firebaseapp.com",
            projectId: "a7kp9xq2",
            storageBucket: "a7kp9xq2.firebasestorage.app",
            messagingSenderId: "778927332114",
            appId: "1:778927332114:web:1e6920c30f4fab9b1031cb",
            measurementId: "G-XJ56STP3Q7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // DOM refs
        const dayTabs = document.getElementById('dayTabsContainer');
        const roomGrid = document.getElementById('roomCardsContainer');
        const emptyState = document.getElementById('emptyState');
        const searchInput = document.getElementById('searchInput');
        const filterBuilding = document.getElementById('filterBuilding');
        const filterStatus = document.getElementById('filterStatus');
        const clearFiltersBtn = document.getElementById('clearFiltersBtn');
        const clockDisplay = document.getElementById('clock-display');
        const finderBtn = document.getElementById('finderBtn');
        const finderDay = document.getElementById('finderDay');
        const finderTime = document.getElementById('finderTime');
        const finderResults = document.getElementById('finderResults');
        const useCurrentTimeBtn = document.getElementById('useCurrentTimeBtn');
        const loader = document.getElementById('loaderOverlay');
        const facultyListContainer = document.getElementById('facultyListContainer');

        // Faculty Modal
        const facultyModal = document.getElementById('facultyModal');
        const facultyModalName = document.getElementById('facultyModalName');
        const facultyModalDay = document.getElementById('facultyModalDay');
        const facultyModalRooms = document.getElementById('facultyModalRooms');
        const facultyModalClose = document.getElementById('facultyModalClose');
        const facultyModalConfirm = document.getElementById('facultyModalConfirm');

        // Helpers
        function showToast(msg, type = 'info') {
            const c = document.getElementById('toastContainer');
            const el = document.createElement('div');
            el.className = `toast-item ${type}`;
            el.innerHTML =
                `<i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i> ${msg}`;
            c.appendChild(el);
            setTimeout(() => el.remove(), 3200);
        }

        function showLoader(show) { loader.classList.toggle('active', show); }

        // Clock 12hr
        function updateClock() {
            const now = new Date();
            let h = now.getHours();
            const m = now.getMinutes().toString().padStart(2, '0');
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            clockDisplay.textContent = `${h}:${m} ${ampm}`;
        }
        updateClock();
        setInterval(updateClock, 30000);

        // Days
        const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
        let currentDay = 'Monday';
        let allAssignments = [];

        function renderDayTabs(activeDay) {
            dayTabs.innerHTML = '';
            DAYS.forEach(day => {
                const btn = document.createElement('button');
                btn.className = `day-tab ${day === activeDay ? 'active' : ''}`;
                btn.textContent = day;
                btn.dataset.day = day;
                btn.addEventListener('click', () => {
                    currentDay = day;
                    renderDayTabs(day);
                    filterAndRender();
                    // Auto-run finder with current time
                    runFinderWithCurrentTime();
                });
                dayTabs.appendChild(btn);
            });
        }

        // Status - ONLY available or occupied
        function getStatus(startTime, endTime) {
            const now = new Date();
            const today = new Date();
            const [sH, sM] = startTime.split(':').map(Number);
            const [eH, eM] = endTime.split(':').map(Number);
            const start = new Date(today);
            start.setHours(sH, sM, 0, 0);
            const end = new Date(today);
            end.setHours(eH, eM, 0, 0);
            if (now >= start && now <= end) return 'occupied';
            return 'available';
        }

        function getStatusLabel(s) {
            const map = { available: 'Available', occupied: 'Occupied' };
            return map[s] || s;
        }

        function statusBadgeClass(s) { return `badge-${s}`; }

        // 12hr format
        function to12hr(time) {
            if (!time) return '';
            const [h, m] = time.split(':').map(Number);
            const ampm = h >= 12 ? 'PM' : 'AM';
            const h12 = h % 12 || 12;
            return `${h12}:${m.toString().padStart(2, '0')} ${ampm}`;
        }

        // Get current time as HH:MM
        function getCurrentTime() {
            const now = new Date();
            const h = now.getHours().toString().padStart(2, '0');
            const m = now.getMinutes().toString().padStart(2, '0');
            return `${h}:${m}`;
        }

        // Run finder with current time
        function runFinderWithCurrentTime() {
            const day = finderDay.value || currentDay;
            const time = getCurrentTime();
            finderTime.value = time;
            performFinderSearch(day, time);
        }

        // Perform finder search
        function performFinderSearch(day, time) {
            if (!time) return;
            const dayAssignments = allAssignments.filter(a => a.day === day);
            const occupied = new Set();
            dayAssignments.forEach(a => {
                if (time >= a.startTime && time <= a.endTime) occupied.add(a.room);
            });
            const allRooms = [...new Set(dayAssignments.map(a => a.room))];
            const free = allRooms.filter(r => !occupied.has(r));
            finderResults.innerHTML = free.length ?
                free.map(r => `<span class="finder-result-chip"><i class="fas fa-check-circle"></i> ${r}</span>`).join('') :
                '<span style="color:var(--text-muted);font-size:0.9rem;">No available rooms at this time.</span>';
        }

        // Get unique faculty for current day
        function getFacultyForDay(assignments) {
            const facultyMap = new Map();
            assignments.forEach(a => {
                if (!a.facultyName) return;
                if (!facultyMap.has(a.facultyName)) {
                    facultyMap.set(a.facultyName, []);
                }
                facultyMap.get(a.facultyName).push(a);
            });
            return facultyMap;
        }

        // Render Faculty List
        function renderFacultyList(assignments) {
            const facultyMap = getFacultyForDay(assignments);
            const sortedNames = Array.from(facultyMap.keys()).sort();

            if (sortedNames.length === 0) {
                facultyListContainer.innerHTML =
                    '<div style="color:var(--text-muted);padding:0.5rem;font-size:0.85rem;">No faculty assigned today.</div>';
                return;
            }

            facultyListContainer.innerHTML = '';
            sortedNames.forEach(name => {
                const rooms = facultyMap.get(name);
                const item = document.createElement('div');
                item.className = 'faculty-item';
                const initials = name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
                item.innerHTML = `
                        <div class="faculty-avatar">${initials}</div>
                        <span class="faculty-name">${name}</span>
                        <span class="faculty-count">${rooms.length}</span>
                        <span class="faculty-arrow"><i class="fas fa-chevron-right"></i></span>
                    `;
                item.addEventListener('click', () => openFacultyModal(name, rooms));
                facultyListContainer.appendChild(item);
            });
        }

        // Open Faculty Modal
        function openFacultyModal(facultyName, rooms) {
            facultyModalName.innerHTML = `<i class="fas fa-user-tie"></i> ${facultyName}`;
            facultyModalDay.textContent = `Assignments for ${currentDay}`;
            facultyModalRooms.innerHTML = '';

            if (!rooms || rooms.length === 0) {
                facultyModalRooms.innerHTML = '<div style="color:var(--text-muted);padding:0.5rem;">No rooms assigned.</div>';
            } else {
                const sorted = [...rooms].sort((a, b) => a.startTime.localeCompare(b.startTime));
                sorted.forEach(a => {
                    const div = document.createElement('div');
                    div.className = 'modal-room-item';
                    const st = getStatus(a.startTime, a.endTime);
                    div.innerHTML = `
                            <div>
                                <span class="room-info"><i class="fas fa-door-open" style="color:var(--primary-yellow);"></i> ${a.room}</span>
                                <div style="font-size:0.8rem;color:var(--text-muted);">${a.building} · Floor ${a.floor}</div>
                            </div>
                            <div style="text-align:right;">
                                <div class="room-time">${to12hr(a.startTime)} – ${to12hr(a.endTime)}</div>
                                <span class="badge-status ${statusBadgeClass(st)}" style="font-size:0.6rem;">${getStatusLabel(st)}</span>
                            </div>
                        `;
                    facultyModalRooms.appendChild(div);
                });
            }

            facultyModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeFacultyModal() {
            facultyModal.classList.remove('active');
            document.body.style.overflow = '';
        }

        facultyModalClose.addEventListener('click', closeFacultyModal);
        facultyModalConfirm.addEventListener('click', closeFacultyModal);
        facultyModal.addEventListener('click', (e) => {
            if (e.target === facultyModal) closeFacultyModal();
        });

        // Filter & Render
        function filterAndRender() {
            const search = searchInput.value.toLowerCase().trim();
            const building = filterBuilding.value;
            const statusFilter = filterStatus.value;
            const day = currentDay;

            let filtered = allAssignments.filter(a => a.day === day);
            if (search) {
                filtered = filtered.filter(a =>
                    (a.room?.toLowerCase().includes(search)) ||
                    (a.facultyName?.toLowerCase().includes(search)) ||
                    (a.subject?.toLowerCase().includes(search)) ||
                    (a.course?.toLowerCase().includes(search)) ||
                    (a.building?.toLowerCase().includes(search))
                );
            }
            if (building) filtered = filtered.filter(a => a.building === building);
            if (statusFilter) {
                filtered = filtered.filter(a => getStatus(a.startTime, a.endTime) === statusFilter);
            }
            filtered.sort((a, b) => a.startTime.localeCompare(b.startTime));

            renderRoomCards(filtered);
            renderFacultyList(filtered);
            renderBuildingView(filtered);
        }

        function renderRoomCards(assignments) {
            roomGrid.innerHTML = '';
            if (!assignments.length) { emptyState.style.display = 'block'; return; }
            emptyState.style.display = 'none';

            const roomMap = new Map();
            assignments.forEach(a => {
                const key = `${a.building}-${a.floor}-${a.room}`;
                if (!roomMap.has(key)) roomMap.set(key, []);
                roomMap.get(key).push(a);
            });

            for (const [key, slots] of roomMap) {
                const first = slots[0];
                let roomStatus = 'available';
                for (const s of slots) {
                    const st = getStatus(s.startTime, s.endTime);
                    if (st === 'occupied') {
                        roomStatus = 'occupied';
                        break;
                    }
                }

                const card = document.createElement('div');
                card.className = 'room-card';
                card.innerHTML = `
                        <div class="room-name"><i class="fas fa-door-open"></i> ${first.room}</div>
                        <div class="meta"><i class="fas fa-building"></i> ${first.building} · Floor ${first.floor}</div>
                        <div style="margin:0.15rem 0 0.3rem;">
                            <span class="badge-status ${statusBadgeClass(roomStatus)}">${getStatusLabel(roomStatus)}</span>
                        </div>
                        ${slots.map(s => {
                            const st = getStatus(s.startTime, s.endTime);
                            return `
                                <div class="assignment-entry">
                                    <strong>${s.facultyName}</strong> · ${s.subject} ${s.course || ''} ${s.section || ''}
                                    <br /><span class="time-slot"><i class="far fa-clock"></i> ${to12hr(s.startTime)} – ${to12hr(s.endTime)}</span>
                                    <span class="badge-status ${statusBadgeClass(st)}" style="margin-left:0.4rem;font-size:0.6rem;">${getStatusLabel(st)}</span>
                                    ${s.remarks ? `<br /><span style="font-size:0.75rem;color:var(--text-muted);"><i class="fas fa-pen"></i> ${s.remarks}</span>` : ''}
                                </div>
                            `;
                        }).join('')}
                    `;
                roomGrid.appendChild(card);
            }
        }

        function renderBuildingView(assignments) {
            const newCas = document.getElementById('floorsNewCas');
            const acad = document.getElementById('floorsAcad');
            newCas.innerHTML = '';
            acad.innerHTML = '';
            const buildings = { 'NEW CAS BUILDING': newCas, 'ACAD BUILDING': acad };

            for (const [bld, container] of Object.entries(buildings)) {
                const floors = [...new Set(assignments.filter(a => a.building === bld).map(a => a.floor))].sort((a, b) => a -
                    b);
                if (!floors.length) {
                    container.innerHTML =
                        '<div style="grid-column:1/-1;color:var(--text-muted);padding:0.3rem;font-size:0.85rem;">No rooms today</div>';
                    continue;
                }
                floors.forEach(floor => {
                    const div = document.createElement('div');
                    div.className = 'floor-card';
                    const rooms = [...new Set(assignments.filter(a => a.building === bld && a.floor === floor).map(a => a
                        .room))];
                    div.innerHTML = `<i class="fas fa-layer-group"></i> Floor ${floor} · ${rooms.join(', ')}`;
                    container.appendChild(div);
                });
            }
        }

        // Finder - Manual check
        finderBtn.addEventListener('click', () => {
            const day = finderDay.value;
            const time = finderTime.value;
            if (!time) { showToast('Please select a time.', 'error'); return; }
            performFinderSearch(day, time);
        });

        // Use Current Time button
        useCurrentTimeBtn.addEventListener('click', () => {
            const day = finderDay.value;
            const time = getCurrentTime();
            finderTime.value = time;
            performFinderSearch(day, time);
            showToast(`Using current time: ${to12hr(time)}`, 'info');
        });

        // Auto-run finder on load and day change
        function autoRunFinder() {
            setTimeout(() => {
                const day = currentDay;
                const time = getCurrentTime();
                finderDay.value = day;
                finderTime.value = time;
                performFinderSearch(day, time);
            }, 500);
        }

        // Firebase listener
        function listenAssignments() {
            showLoader(true);
            const q = query(collection(db, 'assignments'), orderBy('createdAt', 'desc'));
            onSnapshot(q, (snapshot) => {
                allAssignments = [];
                snapshot.forEach(doc => { allAssignments.push({ id: doc.id, ...doc.data() }); });
                showLoader(false);
                filterAndRender();
                autoRunFinder();
                showToast('Schedule updated', 'success');
            }, (err) => {
                showLoader(false);
                showToast('Firestore error: ' + err.message, 'error');
            });
        }

        // Init
        function init() {
            renderDayTabs('Monday');
            listenAssignments();

            clearFiltersBtn.addEventListener('click', () => {
                searchInput.value = '';
                filterBuilding.value = '';
                filterStatus.value = '';
                filterAndRender();
                // Re-run finder after clearing filters
                setTimeout(autoRunFinder, 300);
            });

            [searchInput, filterBuilding, filterStatus].forEach(el => {
                el.addEventListener('input', filterAndRender);
                el.addEventListener('change', filterAndRender);
            });

            document.querySelectorAll('.building-header').forEach(hdr => {
                hdr.addEventListener('click', () => {
                    const target = hdr.nextElementSibling;
                    if (target) target.style.display = target.style.display === 'none' ? 'grid' : 'none';
                });
            });

            onAuthStateChanged(auth, () => {});
        }

        init();
        console.log('CAS Door Calendar · Auto-detects current time for available rooms');
    </script>
</body>
</html>
